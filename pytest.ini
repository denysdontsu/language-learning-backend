[pytest]

# Start operation
addopts =
    -v
    -s
    --tb=short
    --strict-markers

# Files
pythonpath = .
testpaths = tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Async settings
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session